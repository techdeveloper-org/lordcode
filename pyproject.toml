[project]
name = "vishwakarma"
dynamic = ["version"]
description = "Code-generation and auto-test tool with a knowledge-graph framework (kgf) over claude-global-library."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
vishwakarma = "vishwakarma.cli:app"
kgf = "kgf.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vishwakarma*", "kgf*"]

# The VERSION file is the single source of truth (rules/11 §2). Read here rather
# than copied, because the copy had already drifted: this table said 0.1.0 while
# VERSION and CHANGELOG said 1.0.0, so `pip install .` handed a recipient a
# package labelled 0.1.0 on the day 1.0.0 was announced (#50).
[tool.setuptools.dynamic]
version = { file = "VERSION" }
