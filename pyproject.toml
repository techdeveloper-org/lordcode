[project]
name = "vishwakarma"
version = "0.1.0"
description = "Personal local code-generation + auto-test tool powered by NVIDIA's free NIM API."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
vishwakarma = "vishwakarma.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vishwakarma*"]
